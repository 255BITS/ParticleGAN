name: Tests

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main, develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  cpu-tests:
    name: CPU / Python ${{ matrix.python }}
    # Keep branch CI on primary branches, including manual/reusable calls.
    # Tagged releases still use this workflow through release.yml.
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'pull_request' &&
       contains(fromJSON('["master", "main", "develop"]'), github.base_ref)) ||
      (github.event_name != 'pull_request' &&
       contains(fromJSON('["refs/heads/master", "refs/heads/main", "refs/heads/develop"]'), github.ref))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install 'torch>=2.6,<3' 'torchvision>=0.21,<1' --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev,experiments,images,lunar]'
      - name: Validate dependency installation
        run: python -m pip check
      - name: Test numerical kernels and experiment workflows
        run: python -m pytest -q
      - name: Exercise the complete Lunar pipeline and GIF exports
        if: matrix.python == '3.11'
        env:
          SDL_VIDEODRIVER: dummy
        run: python -u examples/fast_lander.py --smoke --out /tmp/lunar-smoke
      - name: Build and smoke-test installed wheel outside checkout
        run: |
          python -m pip wheel --no-deps . --wheel-dir /tmp/particlegan-wheel
          python -m pip install --no-deps --target /tmp/particlegan-installed /tmp/particlegan-wheel/*.whl
          cp examples/particle_autoencoder.py /tmp/particlegan-autoencoder-smoke.py
          cp examples/quickstart_gan.py /tmp/particlegan-gan-smoke.py
          cd /tmp
          PYTHONPATH=/tmp/particlegan-installed python /tmp/particlegan-autoencoder-smoke.py
          PYTHONPATH=/tmp/particlegan-installed python /tmp/particlegan-gan-smoke.py --steps 2 --output /tmp/particlegan-gan-smoke.pt
          PYTHONPATH=/tmp/particlegan-installed python - <<'PY'
          import particlegan
          from particlegan import (
              BatchDistanceDiscriminator, DDGAN, LinearSkipDiscriminator,
              MoGParticlePrior, ParticlePrior, get_recipe,
          )

          assert particlegan.__file__.startswith('/tmp/particlegan-installed/')
          assert ParticlePrior(num_particles=8).sample(2)[0].shape == (2, 4)
          assert MoGParticlePrior(sigma=0.1).sample(2)[0].shape == (2, 4)
          assert DDGAN().steps == 4
          default = get_recipe()
          assert default.lr == 0.00425
          assert default.d_lr_mult == 1.0
          assert default.prior_lr_mult == 2.0
          assert default.betas == (0., .999)
          assert default.reg_arm == 'k3p' and default.reg_coeff == 1.0
          assert default.reg_kappa == 1.0 and default.prior_reg == 0.0
          assert default.name == 'k3p'
          assert get_recipe('gan') == default
          assert not hasattr(default, 'make_trainer')
          assert get_recipe('ae_gan').encoder_mode == 'ae'
          assert get_recipe('vae_gan').encoder_mode == 'hard'
          assert get_recipe('ddgan').model == 'ddgan'
          assert get_recipe('ae_gan').lr == default.lr
          assert get_recipe(prior_kind='mog', sigma_rel=.025, num_particles=8).reg_coeff == 1.
          assert sum(p.numel() for p in LinearSkipDiscriminator().parameters()) == 10467
          assert sum(p.numel() for p in BatchDistanceDiscriminator().parameters()) == 19013
          PY
          PYTHONPATH=/tmp/particlegan-installed python -c "from particlegan import get_recipe; recipe = get_recipe(model='ddgan', prior_kind='mog', sigma_rel=.025, num_particles=8); assert recipe.model == 'ddgan' and recipe.lr == .00425; assert recipe.make_prior().sigma > 0"

  distributions:
    name: Build release distributions
    needs: cpu-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install build twine
      - name: Build source archive and wheel
        run: python -m build
      - name: Keep research artifacts outside release distributions
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          for wheel in Path('dist').glob('*.whl'):
              with zipfile.ZipFile(wheel) as archive:
                  roots = {name.split('/')[0] for name in archive.namelist()}
              assert all(root == 'particlegan' or root.endswith('.dist-info') for root in roots), roots
          research = {'reports', 'results', 'experiments', 'benchmarks', 'lib', 'configs', 'data', 'runs', 'artifacts'}
          for source in Path('dist').glob('*.tar.gz'):
              with tarfile.open(source) as archive:
                  roots = {parts[1] for name in archive.getnames() if len(parts := name.split('/')) > 1}
              assert not roots & research, roots & research
          PY
      - name: Validate package metadata and README
        run: python -m twine check --strict dist/*
      - name: Save tested release distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error
