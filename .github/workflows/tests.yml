name: Tests

on:
  pull_request:
  push:
    branches: [master, api]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  cpu-tests:
    name: CPU / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install 'torch>=2.6,<3' 'torchvision>=0.21,<1' --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev,experiments,images]'
      - name: Validate dependency installation
        run: python -m pip check
      - name: Test numerical kernels and experiment workflows
        run: python -m pytest -q
      - name: Build and smoke-test installed wheel outside checkout
        run: |
          python -m pip wheel --no-deps . --wheel-dir /tmp/particlegan-wheel
          python -m pip install --no-deps --target /tmp/particlegan-installed /tmp/particlegan-wheel/*.whl
          cp examples/particle_autoencoder.py /tmp/particlegan-autoencoder-smoke.py
          cd /tmp
          PYTHONPATH=/tmp/particlegan-installed python /tmp/particlegan-autoencoder-smoke.py
          PYTHONPATH=/tmp/particlegan-installed python -c "import particlegan; from particlegan import ParticlePrior, MoGParticlePrior, DDGAN, get_recipe; assert particlegan.__file__.startswith('/tmp/particlegan-installed/'); assert ParticlePrior(num_particles=8).sample(2)[0].shape == (2, 4); assert MoGParticlePrior().sample(2)[0].shape == (2, 4); assert get_recipe('mog').total_steps == 28000; assert DDGAN().steps == 4; assert get_recipe().lr == 0.0006"
          PYTHONPATH=/tmp/particlegan-installed python -c "from particlegan import get_recipe; recipe = get_recipe('ddgan_mog'); assert recipe.model == 'ddgan' and recipe.total_steps == 100000; assert recipe.make_prior().sigma > 0"

  distributions:
    name: Build release distributions
    needs: cpu-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install build twine
      - name: Build source archive and wheel
        run: python -m build
      - name: Validate package metadata and README
        run: python -m twine check --strict dist/*
      - name: Save tested release distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error
