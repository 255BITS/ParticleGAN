<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405" role="img" aria-labelledby="title desc"><title id="title">GAN v3 training loop</title><desc id="desc">Learned particles feed the generator. Real and generated batches go through the same batch-dependent discriminator in separate calls. Alternate discriminator and generator plus particle updates.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#54657c"/></marker></defs><rect width="1000" height="405" rx="18" fill="#f7f9fc"/><text x="32" y="40" fill="#24364b" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">GAN v3: learn the particles, generator and discriminator</text><rect x="32" y="172" width="180" height="96" rx="12" fill="#e6f1ff" stroke="#d9e1ec"/><text x="46" y="207" fill="#24364b" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">Particles Z</text><text x="46" y="240" fill="#24364b" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Learned latent table</text><rect x="254" y="172" width="176" height="96" rx="12" fill="#e6f1ff" stroke="#d9e1ec"/><text x="268" y="207" fill="#24364b" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">Generator G</text><text x="268" y="240" fill="#24364b" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Turns z into a sample</text><rect x="474" y="172" width="180" height="96" rx="12" fill="#eaf7f1" stroke="#d9e1ec"/><text x="488" y="207" fill="#24364b" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">Generated batch F</text><text x="488" y="240" fill="#24364b" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Current fake samples</text><rect x="704" y="172" width="260" height="96" rx="12" fill="#f1eaff" stroke="#d9e1ec"/><text x="718" y="207" fill="#24364b" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">Discriminator D</text><text x="718" y="240" fill="#24364b" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Sample + neighbor distances</text><line x1="216" y1="220" x2="244" y2="220" stroke="#54657c" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="434" y1="220" x2="464" y2="220" stroke="#54657c" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="658" y1="220" x2="694" y2="220" stroke="#54657c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="704" y="67" width="260" height="65" rx="12" fill="#fff3db" stroke="#d9e1ec"/><text x="718" y="96" fill="#24364b" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">Real batch R</text><text x="718" y="118" fill="#24364b" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Same D, separate batch features</text><line x1="834" y1="136" x2="834" y2="163" stroke="#54657c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="308" fill="#24364b" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">1  Update D</text><text x="178" y="308" fill="#24364b" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Rank real above fake; cap steep input gradients.</text><text x="32" y="342" fill="#24364b" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">2  Update G + Z</text><text x="178" y="342" fill="#24364b" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Raise fake scores; preserve global latent spread.</text><text x="32" y="382" fill="#54657c" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Sample from live G and Z. EMA is measured separately.</text></svg>