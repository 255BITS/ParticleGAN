[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "particlegan"
version = "0.8.0"
description = "Composable PyTorch primitives for learnable particle priors, GANs, and DDGAN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6,<3",
]

[project.urls]
Repository = "https://github.com/255BITS/ParticleGAN"
Documentation = "https://github.com/255BITS/ParticleGAN/blob/master/docs/api.md"

[project.optional-dependencies]
mog = ["scipy>=1.10,<2"]
experiments = [
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "PyYAML>=6,<7",
    "POT>=0.9.5,<0.10",
    "scipy>=1.10,<2",
    "tomli>=2,<3; python_version < '3.11'",
]
dev = ["pytest>=8,<10"]
gym = ["gymnasium[box2d]==1.2.3", "numpy>=1.26,<3"]
lunar = ["gymnasium[box2d]==1.2.3", "numpy>=1.26,<3", "rich>=13,<15", "Pillow>=10,<13", "imageio>=2,<3"]
images = ["torchvision>=0.21,<1", "torch-fidelity==0.3.0", "scipy>=1.10,<1.18", "tqdm>=4.60,<5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["particlegan", "particlegan.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
