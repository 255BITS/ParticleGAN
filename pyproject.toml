[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "particlegan"
version = "0.1.2"
description = "Learnable particle priors and controlled toy GAN experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6,<3",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "PyYAML>=6,<7",
    "POT>=0.9.5,<0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lib", "lib.*", "experiments", "experiments.*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
