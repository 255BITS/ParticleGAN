# Single-seed PacGAN ablation: 2048 points = 256 independent 8-point packs.
# Keep the default architecture, initialization, RpGAN loss and LR schedule.
epochs = 7
steps_per_epoch = 1000
batch_size = 2048
z_dim = 2
num_particles = 20000
lr = 0.00425
d_lr_mult = 1.0
prior_lr_mult = 2.0
beta1 = 0.0
beta2 = 0.999
lambda_ep = 0.0
reg_coeff = 0.0
reg_kappa = 1.0
fourier = 2
pack_size = 8
# Also bypass optimizer guards/damping and input/output training noise.
no_regularizer = true
ema_decay = 0.995
lr_floor = 0.05
lr_anneal_start = 0.6
log_interval = 100
snapshot_interval = 1000000
seed = 1234
prior_kind = "particles"
sigma_rel = 0.0
standardize = false
particle_lr_multiplier = 1.0
mog_metrics = false
reg_every = 1
reg_sync_stats = false
fused_adam = false
final_samples = 20000
save_checkpoint = true
save_plots = false
out_dir = "results/100gaussians/pacgan8_no_reg"
