# Selected recipe, with benchmark architecture and logging settings.
# Every value can be overridden; scripts retain their existing flat schema.
epochs = 7
steps_per_epoch = 1000
batch_size = 2048
z_dim = 2
num_particles = 20000
lr = 0.00425
d_lr_mult = 1.0
prior_lr_mult = 2.0
beta1 = 0.0
beta2 = 0.999
lambda_ep = 0.0
reg_arm = "k3p"
reg_coeff = 1.0
reg_kappa = 1.0
fourier = 2
ema_decay = 0.995
lr_floor = 0.05
lr_anneal_start = 0.6
loss_type = "logistic"
gan_mode = "rp"
log_interval = 1000
snapshot_interval = 1000000
seed = 1234
prior_kind = "particles"
sigma_rel = 0.0
standardize = false
particle_lr_multiplier = 1.0
mog_metrics = false
# particle_beta1 and mog_pass_criteria default to None (TOML has no null value).
reg_method = "autograd"
reg_every = 1
reg_fd_eps = 0.05
reg_sync_stats = true
fused_adam = false
final_samples = 20000
save_checkpoint = true
out_dir = "results/100gaussians/default"
