# Adds marginal critics to concat_class8.yaml; G and the joint critic are unchanged.
architecture: branches
width: 128
num_particles: 1024
critic_mode: joint_marginals
d_conditioning: concat
g_class_scale: 8.0
marginal_width: 128
marginal_weight: 1.0
out_dir: results/transition/conditioning/branches_concat_class8_marginals

# Explicit historical factors; independent of the current example defaults.
encoder: false
shared_state_critic: false
