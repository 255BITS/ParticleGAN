# Relative to concat_class8.yaml, scale only G's observed geometry/time inputs.
# Three independent Gs still share exactly the same noisy MoG draw; no added parameters.
architecture: branches
width: 128
num_particles: 1024
critic_mode: joint
d_conditioning: concat
g_class_scale: 8.0
g_context_scale: 4.0
out_dir: results/transition/conditioning/branches_concat_class8_context4

# Explicit historical factors; independent of the current example defaults.
encoder: false
shared_state_critic: false
