# Same joint critic, plus three independent conditional marginal critics.
architecture: branches
width: 128
num_particles: 1024
critic_mode: joint_marginals
marginal_width: 128
marginal_weight: 1.0
out_dir: results/transition/mog_1024/branches_joint_marginals

# Explicit historical factors; independent of the current example defaults.
d_conditioning: ucd
encoder: false
g_class_scale: 1.0
shared_state_critic: false
