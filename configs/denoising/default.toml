# Selected recipe, with benchmark architecture and logging settings.
# Every value can be overridden; scripts retain their existing flat schema.
model = "ddgan"
d_mode = "ucd"
prior = "learned"
sigma_rel = 0.025
standardize = true
noise = "gaussian"
ucd_target = "class"
seed = 24002
classes = 4
std = 0.03
alpha_bar = [1.0, 0.9, 0.5, 0.05, 0.0001]
z_dim = 2
num_particles = 20000
noise_particles = 1024
hidden = 128
depth = 3
fourier = 2
steps = 7000
batch_size = 2048
lr = 0.00425
d_lr_mult = 1.0
prior_lr_mult = 2.0
noise_lr_mult = 1.0
beta1 = 0.0
beta2 = 0.999
prior_reg = 0.0
noise_reg = 0.0
reg_coeff = 1.0
reg_kappa = 1.0
reg_every = 1
reg_sync_stats = true
fused_adam = false
ucd_lambda = 0.02
drop_xt = false
ema = 0.995
lr_anneal_start = 0.6
lr_floor = 0.05
eval_interval = 1000
eval_samples = 8192
final_samples = 20000
probe_samples = 256
save_checkpoint = true
out_dir = "results/denoising/ddgan_ucd"
