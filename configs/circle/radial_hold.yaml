device: cpu
width: 128
encoder_width: 128
d_width: 128
z_dim: 8
num_particles: 64
sigma_rel: 0.5
pretrain_steps: 300
finetune_steps: 2000
batch_size: 128
log_interval: 25
adv_weight: 1.0
error_tokens: 8
error_width: 48
error_heads: 4
normalization_samples: 8192
eval_episodes: 128
recovery_window: 64
edit_frame: radial_tangent
