# Same paired-error spine as paired_error.yaml. One tangent/radial critic, radial
# divisor capped at the expert radial spread. Finetune rows that leave the circle
# use a wider normalized radius so the restore clears the critic noise. The
# critic fit and the evaluation panels stay on the protocol radius range.
# Three quarters of finetune rows stay on the circle so the tangent step is not
# pulled fast by the wide restore targets.
seed: 24002
device: cpu
width: 128
encoder_width: 128
d_width: 128
z_dim: 8
num_particles: 64
sigma_rel: 0.5
pretrain_steps: 300
finetune_steps: 2000
batch_size: 128
log_interval: 25
adv_weight: 1.0
error_tokens: 8
error_width: 48
error_heads: 4
normalization_samples: 8192
eval_episodes: 128
recovery_window: 64
edit_frame: radial_tangent
rho_low: 0.5
rho_high: 1.5
on_circle_rate: 0.75
out_dir: results/circle_transition/radial_hold
live_log: results/circle_transition/live.log
save_checkpoint: true
