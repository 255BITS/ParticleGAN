# Revised safe-fast arm. Not the #18 paired-error default, and not the #21
# recipe that scored 0/20 val and 0/50 test. particle.yaml leaves
# safe_fast_weight at 0. adv_weight stays 1.
#
# #21 fed [main, side] into a bipolar step as [lateral, vertical] and paid a
# success bonus at speed 0.62. This file uses throttle_up (main engine off is
# thrust 0, side engine stays lateral) and the closed-loop soft speed 0.18.
# A Lunar retrain of that plant then collapsed after a healthy step-1000
# checkpoint (17/20) by step 2500 (0/20). When this weight is on, export
# keeps the last checkpoint the late-collapse rule still accepts instead of
# copying step=max. adv_weight stays 1. That Lunar retrain has not been run.
arm: particle
steps: 2500
batch_size: 256
checkpoints: [250, 1000, 2500]
device: cuda:1
out_dir: results/gym/lunar_lander_particle_finetune/particle_safe_fast
live_log: results/gym/lunar_lander_particle_finetune/safe_fast_live.log
imitation_weight: 0.0
real_encoding_weight: 0.0
synthetic_reconstruction_weight: 0.0
adv_weight: 1.0
train_scope: control
error_tokens: 8
error_width: 48
error_heads: 4
safe_fast_weight: 1.0
safe_fast_time_weight: 0.15
safe_fast_crash_weight: 4.0
safe_fast_success_bonus: 2.0
safe_fast_speed_limit: 0.18
safe_fast_pad_half: 0.35
safe_fast_horizon: 40
safe_fast_action_map: throttle_up
